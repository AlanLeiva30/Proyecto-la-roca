# Grupo La Roca - Sistema de inventario y abastecimiento
# Odoo 18 Community + PostgreSQL 16. Los datos se conservan en volúmenes de Docker.
name: laroca

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - laroca-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_DB: ${ODOO_DB:-laroca}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - laroca-odoo-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./src/addons:/mnt/extra-addons
      - ./scripts:/mnt/scripts:ro

  # Buzón de PRUEBA: atrapa todos los correos que envía Odoo (no salen a internet).
  # Ver los correos en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 1000

volumes:
  laroca-db-data:
  laroca-odoo-data:
