[options]
; PRODUCCIÓN (servidor de 2 GB). Las credenciales de la base llegan por variables de entorno.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_name = laroca
dbfilter = ^laroca$
; Sin gestor web de bases de datos (no se pueden crear/borrar/descargar BD desde el navegador)
list_db = False
without_demo = all
; Odoo está detrás de Caddy (HTTPS): respeta la dirección y el protocolo reales
proxy_mode = True
; Varios procesos para atender a varios usuarios a la vez
workers = 2
max_cron_threads = 1
gevent_port = 8072
limit_memory_soft = 671088640
limit_memory_hard = 805306368
limit_time_cpu = 120
limit_time_real = 300
log_level = warn
