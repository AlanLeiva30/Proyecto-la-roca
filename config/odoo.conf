[options]
; Las credenciales de la base de datos llegan por variables de entorno (docker-compose.yml).
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; Una sola base de datos: el login abre directamente "laroca".
db_name = laroca
dbfilter = ^laroca$
; Desactiva el gestor web de bases de datos (no se pueden crear/borrar BD desde el navegador).
list_db = False
; No cargar datos de demostración de Odoo; usamos nuestros propios datos ficticios.
without_demo = all
proxy_mode = False
log_level = info
