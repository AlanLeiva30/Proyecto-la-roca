# Grupo La Roca - PRODUCCIÓN (servidor en la nube)
# Igual que docker-compose.yml, pero:
#  - Odoo NO se publica directo: entra por Caddy, que pone HTTPS (Let's Encrypt) automáticamente.
#  - Odoo con "workers" (varios procesos) y límites de memoria para un servidor de 2 GB.
#  - El buzón de prueba (Mailpit) queda en https://correo.<dominio>, protegido con usuario y clave.
# En el servidor, el archivo .env tiene COMPOSE_FILE=docker-compose.prod.yml, así los scripts
# (inicializar.sh, actualizar.sh) usan este archivo sin cambios.
name: laroca

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - laroca-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_DB: ${ODOO_DB:-laroca}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
    volumes:
      - laroca-odoo-data:/var/lib/odoo
      - ./config/odoo.prod.conf:/etc/odoo/odoo.conf:ro
      - ./src/addons:/mnt/extra-addons
      - ./scripts:/mnt/scripts:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 1000

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
      CORREO_USUARIO: ${CORREO_USUARIO:-laroca}
      CORREO_CLAVE_HASH: ${CORREO_CLAVE_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  laroca-db-data:
  laroca-odoo-data:
  caddy-data:
  caddy-config:
